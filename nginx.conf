# "map" só pra não repetir essa string enorme 3x — precisa ficar fora do
# server{} (contexto http), e "$host" aqui não filtra nada de verdade, é
# só a variável de entrada que o map exige.
#
# 'unsafe-inline' em script/style continua liberado de propósito — cada
# página tem bastante <script>/<style> inline (animações, tracking,
# formulário) e trocar tudo isso pra nonce é um recorte maior, arriscado
# de fazer sem quebrar nada; mesmo assim, isso já barra injeção de
# <script src="outrodominio"> e framing por outro site. data: em
# img-src é pro QR Code do Pix (data:image/png;base64,... no <img>).
map $host $csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://alisson-naipe-api.wdgseb.easypanel.host; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Repetidos em cada location (em vez de só uma vez aqui) de propósito:
    # no nginx, um location com add_header próprio NÃO herda os do bloco
    # pai — cada location abaixo já define o Cache-Control dela, então sem
    # repetir isso os cabeçalhos de segurança somem justamente nas páginas
    # e nos assets, sobrando só nos caminhos sem add_header nenhum.

    # HTML nunca em cache — sempre revalidar, pra atualização de conteúdo
    # (fotos, textos, preços) aparecer na hora sem precisar limpar cache.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # Assets versionados pelo próprio nome de arquivo (fotos, vídeo, fontes)
    # podem cachear por mais tempo — trocamos o arquivo, não o conteúdo.
    location ~* \.(?:jpg|jpeg|png|webp|mp4|woff2?|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # o próprio arquivo de config acaba copiado pra dentro da pasta
    # estática (COPY . .) — não precisa ficar servível
    location = /nginx.conf {
        deny all;
    }

    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ =404;
    }
}
